<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importar datos 8S a Firebase</title>
<style>
body{font-family:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#141833;background:#EEF0F7;line-height:1.5}
h1{color:#0D18A8}
.card{background:#fff;border:1px solid #D5D9E8;border-radius:12px;padding:20px;margin-bottom:16px}
button{background:#FF4E00;color:#fff;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer}
button[disabled]{opacity:.45;cursor:not-allowed}
#log{background:#141833;color:#E4E8FA;border-radius:10px;padding:14px;font:14px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;min-height:120px}
.warn{background:#FFF1EA;color:#8A2A00;border-radius:10px;padding:12px 14px;font-weight:600}
</style>
</head>
<body>
<h1>Importar datos de la auditoría 8S</h1>
<div class="card warn">Úsala una sola vez, con las reglas de importación publicadas en Firestore. Al terminar, publica las reglas finales (firestore.rules).</div>
<div class="card">
  <p><b>1.</b> Selecciona <code>catalogos.json</code>: <input type="file" id="fCat" accept=".json"></p>
  <p><b>2.</b> Selecciona <code>historial.json</code>: <input type="file" id="fHis" accept=".json"></p>
  <button id="go" disabled>Importar</button>
</div>
<div id="log">Esperando archivos…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const log = t => { $('log').textContent += '\n' + t; $('log').scrollTop = 1e9; };
let CAT=null, HIS=null;
const leer = f => new Promise((ok,err)=>{ const r=new FileReader(); r.onload=()=>{ try{ ok(JSON.parse(r.result)); }catch(e){ err(e); } }; r.onerror=err; r.readAsText(f); });
async function revisar(){
  try{
    if($('fCat').files[0]) CAT = await leer($('fCat').files[0]);
    if($('fHis').files[0]) HIS = await leer($('fHis').files[0]);
  }catch(e){ log('Error leyendo archivo: ' + e.message); }
  $('go').disabled = !(CAT && HIS && CAT.preguntas && HIS.auditorias);
  if(CAT && HIS) { $('log').textContent = `Listo para importar: ${CAT.preguntas.length} preguntas, ${CAT.areas.length} áreas, ${CAT.equipos.length} equipos, ${Object.keys(HIS.empleados).length} empleados, ${HIS.auditorias.length} auditorías. Último folio: ${HIS.ultimoFolio}.`; }
}
$('fCat').onchange = revisar; $('fHis').onchange = revisar;

async function enLotes(ops, etiqueta){
  for(let i=0;i<ops.length;i+=400){
    const b = writeBatch(db);
    ops.slice(i,i+400).forEach(([ref,data])=>b.set(ref,data));
    await b.commit();
    log(`${etiqueta}: ${Math.min(i+400,ops.length)} / ${ops.length}`);
  }
}

$('go').onclick = async ()=>{
  $('go').disabled = true;
  try{
    const f = await getDoc(doc(db,'config','folio'));
    if(f.exists() && !confirm(`Ya existe un contador de folios (último: ${f.data().ultimo}). Si continúas se sobrescriben catálogos e historial. ¿Continuar?`)){ $('go').disabled=false; return; }

    await enLotes([[doc(db,'catalogos','general'), {...CAT, actualizado: serverTimestamp()}]], 'Catálogos');
    await enLotes(Object.entries(HIS.empleados).map(([n,e])=>[doc(db,'empleados',n), e]), 'Empleados');
    await enLotes(HIS.auditorias.map(a=>[doc(db,'auditorias',String(a.folio)), a]), 'Auditorías');

    const porMes = {};
    HIS.auditorias.forEach(a=>{
      (porMes[a.mes] ||= []).push({f:a.folio, d:a.departamento, a:a.area, fe:a.fecha, q:a.quincena, p:a.calificacion, sp:a.puntosS, eq:a.equipo, co:a.coordinador,
        h:a.respuestas.filter(r=>r.cumple==='No').map(r=>({s:r.s, n:r.n, c:r.comentario}))});
    });
    await enLotes(Object.entries(porMes).map(([m,l])=>[doc(db,'resumen',m), {auditorias:l, actualizado: serverTimestamp()}]), 'Resúmenes mensuales');

    await enLotes([[doc(db,'config','folio'), {ultimo: HIS.ultimoFolio}]], 'Contador de folios');
    log('\n✓ Importación terminada. Ahora publica las reglas finales (firestore.rules).');
  }catch(e){ log('✗ Error: ' + e.message); $('go').disabled=false; }
};
</script>
</body>
</html>
