<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resultados 8S · Zubex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0D18A8;--naranja:#FF4E00;--morado:#9631F7;--ok:#1E8E3E;--mal:#D7261E;
  --bg:#EEF0F7;--panel:#fff;--ink:#141833;--ink2:#50577A;--line:#D5D9E8;
  --font:"Schibsted Grotesk","Lab Grotesque","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1130;--panel:#181C44;--ink:#EEF0FA;--ink2:#A7ADCF;--line:#2C3163;}}
:root[data-theme="dark"]{--bg:#0E1130;--panel:#181C44;--ink:#EEF0FA;--ink2:#A7ADCF;--line:#2C3163;}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.hide{display:none!important}

/* Barra */
.top{background:var(--azul);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:#fff;text-decoration:none}
.brand img{height:40px;width:40px;border-radius:50%;background:#fff;object-fit:contain}
.brand b{font-size:20px;font-weight:800;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.8}
.nav{display:flex;gap:6px}
.nav a{color:#fff;text-decoration:none;font-weight:700;padding:9px 14px;border-radius:8px;opacity:.8}
.nav a[aria-current=page]{background:rgba(255,255,255,.16);opacity:1}
main{max-width:1200px;margin:0 auto;padding:20px 20px 60px}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--ink2);gap:4px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:130px;font-size:15px;font-weight:500;color:var(--ink)}
.filters .grow{flex:1;min-width:200px}
.filters .grow input{width:100%}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer}
.b1{background:var(--naranja);color:#fff}
.b3{background:transparent;border:1px solid var(--line);color:var(--ink)}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.acts label.chk{flex-direction:row;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ink2)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--naranja)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--ink2)}

/* Portada */
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
.hero .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.hero-l{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.hero-l img{width:min(300px,70%);height:auto;border-radius:12px;background:#fff}
.hero-l h1{margin:0;font-size:30px;letter-spacing:-.01em}
.hero-l p{margin:0;color:var(--ink2)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
.bigbtns a{display:block;text-decoration:none;text-align:center;font-size:22px;font-weight:800;padding:20px;border-radius:14px;background:var(--azul);color:#fff}
.bigbtns a+a{background:var(--naranja)}
.gauge-card h2{margin:0;font-size:18px;color:var(--ink2);font-weight:700;text-align:center}
.gauge-card svg{width:100%;max-width:460px;display:block;margin:6px auto 0}
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.dep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;background:var(--bg)}
.dep b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.dep span{font-size:13px;color:var(--ink2);font-weight:600}
.okc{color:var(--ok)} .malc{color:var(--mal)} .nac{color:#8A90A6}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* Hoja imprimible (siempre fondo blanco) */
.sheet{container-type:inline-size;background:#fff;color:#141833;width:100%;aspect-ratio:11/8.5;border-radius:4px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(13,24,168,.45);overflow:hidden;display:grid;grid-template-rows:auto 1fr 1fr;grid-template-columns:1fr 1fr;padding:1.6cqw 2cqw}
.shd{grid-column:1/3;display:flex;align-items:center;gap:1.5cqw;border-bottom:.25cqw solid #0D18A8;padding-bottom:.8cqw}
.shd h2{margin:0;color:#0D18A8;font-size:2.5cqw;font-weight:800;line-height:1.1;margin-right:auto}
.shd h2 span{display:block;color:#50577A;font-size:1.45cqw;font-weight:500;margin-top:.2cqw}
.shd img{height:4.6cqw;width:auto}
.q{padding:1.4cqw 1.4cqw 0;display:flex;flex-direction:column;min-height:0;min-width:0}
.q:nth-of-type(2n+1){border-left:.12cqw solid #C9CDEA}
.q:nth-of-type(n+4){border-top:.12cqw solid #C9CDEA}
.qh{margin:0 0 .6cqw;color:#0D18A8;font-weight:800;font-size:1.75cqw}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:1.05cqw;color:#50577A;font-weight:700;text-align:center;padding:0 .5cqw .3cqw;border-bottom:.12cqw solid #0D18A8}
.tbl th:first-child{text-align:left}
.tbl td{font-size:var(--fs,1.6cqw);padding:.12cqw .5cqw;border-bottom:.08cqw solid #E1E4F0;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.tbl td:first-child{text-align:left;font-weight:600}
.tbl tfoot td{border-top:.2cqw solid #0D18A8;border-bottom:0;padding-top:.3cqw}
.tbl tr.clic{cursor:pointer}
.tbl tr.sel td:first-child{box-shadow:inset .4cqw 0 0 #FF4E00}
.t-ok{color:#1E8E3E}.t-mal{color:#D7261E}.t-na{color:#9AA0B8;font-weight:600!important}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.35em;vertical-align:.02em}
.best{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:.3cqw solid #0D18A8;border-radius:.8cqw;margin-bottom:1.2cqw;padding:1cqw}
.best b{font-size:3.8cqw;line-height:1.05;font-weight:800;color:#0D18A8}
.best em{font-style:normal;font-size:5.6cqw;font-weight:800;line-height:1;margin-top:.6cqw;font-variant-numeric:tabular-nums}
.best small{font-size:1.2cqw;color:#50577A;margin-top:.5cqw}
.chart{flex:1;min-height:0;padding-bottom:1cqw}
.chart svg{width:100%;height:100%;display:block}
.srow{display:grid;grid-template-columns:28% 1fr 10%;align-items:center;gap:.8cqw;font-size:1.2cqw;margin-top:.3cqw;line-height:1.15}
.srow .bar{height:1.4cqw;border:.1cqw solid #C9CDEA;border-radius:.3cqw;overflow:hidden}
.srow .bar i{display:block;height:100%;background:#AEB4F0}
.srow.low .bar i{background:#FFB999}
.srow .pct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.srow .n{font-size:.9cqw;color:#50577A;display:block}
.foot{margin-top:auto;font-size:1cqw;color:#50577A;padding:.4cqw 0 1cqw}
.gwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding-bottom:1cqw}
.gwrap svg{height:100%;max-width:100%}

/* Paneles en pantalla */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:18px}
.panel h2{margin:0 0 4px;font-size:20px}
.panel .sub{color:var(--ink2);margin:0 0 12px;font-size:14px}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 22px}
.eq{display:grid;grid-template-columns:1fr 150px 44px;gap:10px;align-items:center;font-size:14px}
.eq .bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.eq .bar i{display:block;height:100%;background:var(--azul)}
.eq .bar i.m{background:var(--mal)}
.eq b{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
.list{width:100%;border-collapse:collapse;font-size:15px}
.list th{text-align:left;font-size:12px;color:var(--ink2);font-weight:700;border-bottom:2px solid var(--line);padding:8px 10px;white-space:nowrap}
.list td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
.list .pq{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.rk{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:1px solid var(--line)}
.rk.r1{border:2px solid #C9A227;color:#8A6D00}.rk.r2{border:2px solid #9AA0B8;color:#50577A}.rk.r3{border:2px solid #B8733A;color:#8A4B17}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.foot2{color:var(--ink2);font-size:13px;margin-top:22px}

/* Impresión */
#print-root{display:none}
.ph{width:100%;border-collapse:collapse;font-family:var(--font);color:#141833;font-size:10.5pt}
.ph thead td{padding:0 0 8px}
.phh{display:flex;align-items:center;gap:14px;border-bottom:2.5px solid #0D18A8;padding-bottom:6px}
.phh h2{margin:0;color:#0D18A8;font-size:17pt;margin-right:auto;line-height:1.1}
.phh h2 span{display:block;font-size:10.5pt;color:#50577A;font-weight:500}
.phh img{height:44px}
.ph th{text-align:left;font-size:9pt;color:#50577A;border-bottom:1.5px solid #0D18A8;padding:5px 6px}
.ph tbody td{border-bottom:1px solid #D9DCEA;padding:3px 6px;vertical-align:top}
.ph tr{break-inside:avoid}
.ph .pq{display:block;font-size:8.5pt;color:#50577A}
.ph tr.grp td{border-bottom:1.5px solid #0D18A8;padding-top:8px;font-weight:800;color:#0D18A8;font-size:11.5pt}
@page{size:letter landscape;margin:0.3in}
@media print{
  html,body{background:#fff!important}
  :root{padding:0}
  .top,main{display:none!important}
  #print-root{display:block}
  #print-root .sheet{width:10.4in;height:7.9in;aspect-ratio:auto;box-shadow:none;border-radius:0;break-after:page;page-break-after:always}
  #print-root > :last-child{break-after:auto;page-break-after:auto}
  #print-root .ph{break-after:page}
  #print-root .ph:last-child{break-after:auto}
  .tbl tr.sel td:first-child{box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const META = 95;
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MC=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const SN=['Seguridad','SQF-BPM´s','Sustentabilidad','Seleccionar','Ordenar','Limpiar','Estandarizar','Mantener'];
const DEPS=['EXTRUSIÓN','IMPRESIÓN','CONVERSIÓN','CORRUGADO','CALIDAD','INGENIERÍA','ADMINISTRACIÓN PRODUCTIVA'];
const DN={'EXTRUSIÓN':'Extrusión','IMPRESIÓN':'Impresión','CONVERSIÓN':'Conversión','CORRUGADO':'Corrugado','CALIDAD':'Calidad','INGENIERÍA':'Ingeniería','ADMINISTRACIÓN PRODUCTIVA':'Admón. Productiva'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nat=(a,b)=>a.localeCompare(b,'es',{numeric:true,sensitivity:'base'});
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const f1=v=>v==null?'N/A':(Math.round(v*10)/10).toFixed(Math.abs(v-Math.round(v))<0.05?0:1);
const tc=v=>v==null?'t-na':(v>=META?'t-ok':'t-mal');
const cell=(v,txt)=>`<td class="${tc(v)}">${v==null?(txt||'N/A'):`<span class="dot" style="background:${v>=META?'#1E8E3E':'#D7261E'}"></span>${f1(v)}`}</td>`;
$('lg8').src=LOGO8S;

let A=[], CAT=null, SMAX=[];
const st={v:'inicio', ym:'', q:'', dep:-1, co:'', eq:'', area:'', s:'', txt:''};

// ---------- cálculos ----------
function base(o={}){ const f={...st,...o}; return A.filter(x=>(!f.ym||x.m===f.ym)&&(!f.q||x.q===+f.q)&&(!f.co||x.co===f.co)&&(!f.eq||x.eq===f.eq)&&(f.dep<0||x.d===DEPS[f.dep])); }
function areaProm(au,a){ return avg(au.filter(x=>x.a===a).map(x=>x.p)); }
function depProm(au,d){ const s=au.filter(x=>x.d===d); return avg([...new Set(s.map(x=>x.a))].map(a=>areaProm(s,a))); }
function plantaProm(au){ return avg(DEPS.map(d=>depProm(au,d)).filter(v=>v!=null)); }
function areasDe(d,ym){ const cat=(CAT.areas||[]).filter(a=>a.d===d); const act=new Map(cat.map(a=>[a.a,a.activa]));
  A.filter(x=>x.d===d&&x.m===ym).forEach(x=>{ if(!act.has(x.a)) act.set(x.a,true); });
  return [...act.entries()].map(([a,activa])=>({a,activa})).sort((x,y)=>nat(x.a,y.a)); }
const ymTxt=ym=>MESES[+ym.slice(5)-1]+' '+ym.slice(0,4);
const filtTxt=()=>[st.q?`Quincena ${st.q}`:'',st.co?`Coordinador: ${st.co}`:'',st.eq?`Equipo: ${st.eq}`:''].filter(Boolean).join(' · ');

// ---------- gráficos ----------
function trendSVG(vals){
  const W=560,H=250,L=30,B=24,T=22,R=8,min=50,max=100,n=12,bw=(W-L-R)/n;const y=v=>T+(H-T-B)*(1-(Math.max(min,v)-min)/(max-min));
  let g='';[50,60,70,80,90,100].forEach(t=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#E3E6F0"/><text x="${L-5}" y="${y(t)+3.5}" font-size="10" text-anchor="end" fill="#8A90A6">${t}</text>`);
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;
    if(v!=null) g+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${H-B-y(v)}" fill="${v>=META?'#AEB4F0':'#FFB999'}" stroke="${v>=META?'#0D18A8':'#D7261E'}" stroke-width="1.2" rx="2"/><text x="${x+w/2}" y="${y(v)-5}" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141833">${f1(v)}</text>`;
    g+=`<text x="${x+w/2}" y="${H-7}" font-size="10.5" text-anchor="middle" fill="#50577A">${MC[i]}</text>`;});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(META)}" y2="${y(META)}" stroke="#FF4E00" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(META)-5}" font-size="10.5" font-weight="700" text-anchor="end" fill="#FF4E00">Meta ${META}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Tendencia mensual">${g}</svg>`;
}
function trendDe(fn){ const y=st.ym.slice(0,4); return trendSVG(MC.map((_,i)=>{const ym=y+'-'+String(i+1).padStart(2,'0'); return ym<=st.ym?fn(base({ym})):null;})); }
function gaugeSVG(v){
  const cx=150,cy=140,r=110,a=p=>Math.PI*(1-p/100),pt=p=>[cx+r*Math.cos(a(p)),cy-r*Math.sin(a(p))];
  const arc=(p0,p1,c,w)=>{const [x0,y0]=pt(p0),[x1,y1]=pt(p1);return `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="butt"/>`;};
  const [mx,my]=pt(META),[mx2,my2]=[cx+(r+22)*Math.cos(a(META)),cy-(r+22)*Math.sin(a(META))],[mx0,my0]=[cx+(r-22)*Math.cos(a(META)),cy-(r-22)*Math.sin(a(META))];
  const col=v==null?'#C9CDEA':(v>=META?'#1E8E3E':'#D7261E');
  return `<svg viewBox="0 0 300 175" role="img" aria-label="Promedio general ${f1(v)}">${arc(0,100,'#E6E8F4',34)}${v!=null?arc(0,Math.max(.5,Math.min(100,v)),col,34):''}
   <line x1="${mx0}" y1="${my0}" x2="${mx2}" y2="${my2}" stroke="#FF4E00" stroke-width="3"/><text x="${mx2+4}" y="${my2-2}" font-size="13" font-weight="800" fill="#FF4E00">${META}</text>
   <text x="${cx}" y="${cy-8}" font-size="44" font-weight="800" text-anchor="middle" fill="${col==='#C9CDEA'?'#8A90A6':col}" font-family="Schibsted Grotesk,Arial">${f1(v)}</text>
   <text x="${cx-r}" y="${cy+22}" font-size="12" text-anchor="middle" fill="#8A90A6">0</text><text x="${cx+r}" y="${cy+22}" font-size="12" text-anchor="middle" fill="#8A90A6">100</text></svg>`;
}
function porS(au){
  if(!au.length) return '<p class="foot">Sin auditorías con estos filtros.</p>';
  return SN.map((n,i)=>{const t=au.reduce((s,x)=>s+(x.sp?.[i]||0),0),mx=SMAX[i]*au.length,p=mx?t/mx*100:null,h=au.reduce((s,x)=>s+x.h.filter(k=>k.s===i).length,0);
    return `<div class="srow ${p!=null&&p<META?'low':''}"><span>${n}<span class="n">${h} hallazgo${h===1?'':'s'}</span></span><div class="bar"><i style="width:${p??0}%"></i></div><span class="pct">${p==null?'N/A':Math.round(p)+'%'}</span></div>`}).join('')
    +`<p class="foot">% de puntos obtenidos en ${au.length} auditoría${au.length===1?'':'s'}.</p>`;
}
const shd=(t,sub)=>`<div class="shd"><h2>${t}<span>${sub}</span></h2><img src="${LOGO8S}" alt="8S"><img src="${LOGOZX}" alt="Zubex"></div>`;

// ---------- hojas ----------
function sheetDep(d,forPrint){
  const D=DEPS[d], au=base({dep:d}), rows=areasDe(D,st.ym);
  const both=!st.q, fs=Math.min(1.7,Math.max(.95,19/(rows.length+2)));
  const val=(a,q)=>areaProm(au.filter(x=>!q||x.q===q),a);
  const tb=rows.map(r=>{const any=au.some(x=>x.a===r.a);const na=r.activa?'N/A':'En pausa';
    return `<tr class="${forPrint?'':'clic'} ${!forPrint&&st.area===r.a?'sel':''}" data-area="${esc(r.a)}"><td>${esc(r.a)}</td>${both?cell(val(r.a,1),any?'—':na)+cell(val(r.a,2),any?'—':na):''}${cell(val(r.a,0),na)}</tr>`}).join('');
  const pr=depProm(au,D), con=rows.map(r=>({a:r.a,v:val(r.a,0)})).filter(r=>r.v!=null), top=con.length?Math.max(...con.map(r=>r.v)):null;
  const qp=q=>depProm(au.filter(x=>x.q===q),D);
  return `<article class="sheet">${shd(`Resultados 8S · ${DN[D]}`, ymTxt(st.ym)+(filtTxt()?' · '+esc(filtTxt()):''))}
   <div class="q"><h3 class="qh">Calificación por área</h3><table class="tbl" style="--fs:${fs}cqw"><thead><tr><th>Área</th>${both?'<th>1ª quinc.</th><th>2ª quinc.</th>':''}<th>${both?'Mes':'Quincena '+st.q}</th></tr></thead><tbody>${tb}</tbody>
    <tfoot><tr><td>Promedio</td>${both?cell(qp(1),'—')+cell(qp(2),'—'):''}${cell(pr)}</tr></tfoot></table></div>
   <div class="q"><h3 class="qh">Línea con mejor resultado</h3><div class="best">${top!=null?`<b>${con.filter(r=>r.v===top).map(r=>esc(r.a)).join(' / ')}</b><em class="${tc(top)}">${f1(top)}</em><small>Meta ${META}</small>`:'<b>Sin auditorías</b>'}</div></div>
   <div class="q"><h3 class="qh">Tendencia ${st.ym.slice(0,4)}</h3><div class="chart">${trendDe(x=>depProm(x.filter(y=>y.d===D),D))}</div></div>
   <div class="q"><h3 class="qh">Calificación por S</h3>${porS(au)}</div></article>`;
}
function sheetPlanta(){
  const au=base({dep:-1}), both=!st.q;
  const rows=DEPS.map(D=>({D,q1:depProm(au.filter(x=>x.q===1),D),q2:depProm(au.filter(x=>x.q===2),D),t:depProm(au,D)}));
  const tot=plantaProm(au);
  return `<article class="sheet">${shd('Resultados 8S · Planta', ymTxt(st.ym)+(filtTxt()?' · '+esc(filtTxt()):''))}
   <div class="q"><h3 class="qh">Calificación por departamento</h3><table class="tbl" style="--fs:1.45cqw"><thead><tr><th>Departamento</th>${both?'<th>1ª quinc.</th><th>2ª quinc.</th>':''}<th>${both?'Mes':'Quincena '+st.q}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${DN[r.D]}</td>${both?cell(r.q1,'—')+cell(r.q2,'—'):''}${cell(r.t)}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total planta</td>${both?cell(plantaProm(au.filter(x=>x.q===1)),'—')+cell(plantaProm(au.filter(x=>x.q===2)),'—'):''}${cell(tot)}</tr></tfoot></table></div>
   <div class="q"><h3 class="qh">Promedio general de planta</h3><div class="gwrap">${gaugeSVG(tot)}</div></div>
   <div class="q"><h3 class="qh">Tendencia ${st.ym.slice(0,4)}</h3><div class="chart">${trendDe(plantaProm)}</div></div>
   <div class="q"><h3 class="qh">Calificación por S</h3>${porS(au)}</div></article>`;
}
function hallRows(){
  let rows=base({ym:st.ym}).filter(x=>!st.area||x.a===st.area).flatMap(x=>x.h.map(h=>({...x,s:h.s,n:h.n,c:h.c})));
  if(st.s!=='') rows=rows.filter(r=>r.s===+st.s);
  const t=st.txt.toLowerCase(); if(t) rows=rows.filter(r=>(r.c+' '+r.a+' '+r.eq+' '+(PQ[r.n]||'')).toLowerCase().includes(t));
  return rows.sort((x,y)=>DEPS.indexOf(x.d)-DEPS.indexOf(y.d)||nat(x.a,y.a)||x.fe.localeCompare(y.fe)||x.n-y.n);
}
function printHall(rows,titulo,conPreg){
  let body='',last='';
  rows.forEach(r=>{ if(r.a!==last){ last=r.a; const k=rows.filter(x=>x.a===r.a).length; body+=`<tr class="grp"><td colspan="4">${esc(r.a)} · ${DN[r.d]} — ${k} hallazgo${k===1?'':'s'}</td></tr>`; }
    body+=`<tr><td style="white-space:nowrap">${r.fe.slice(8)}/${r.fe.slice(5,7)}</td><td>${SN[r.s]}</td><td><b>${esc(r.c||'Sin comentario')}</b> <span style="color:#50577A">(P${r.n})</span>${conPreg?`<span class="pq">${esc(PQ[r.n]||'')}</span>`:''}</td><td>${esc(r.eq)}</td></tr>`; });
  if(!rows.length) body='<tr><td colspan="4" style="padding:20px 6px">Sin hallazgos con estos filtros.</td></tr>';
  return `<table class="ph"><thead><tr><td colspan="4"><div class="phh"><h2>${titulo}<span>${ymTxt(st.ym)}${filtTxt()?' · '+esc(filtTxt()):''}</span></h2><img src="${LOGO8S}" alt=""><img src="${LOGOZX}" alt=""></div></td></tr>
    <tr><th style="width:60px">Fecha</th><th style="width:120px">S</th><th>Hallazgo</th><th style="width:150px">Equipo</th></tr></thead><tbody>${body}</tbody></table>`;
}
let PQ={};
let DB=null; const RC={}; const rc={y:'', dep:'', min:'3'};
async function cargarAnio(y){
  if(RC[y]) return RC[y];
  const s=await getDocs(query(collection(DB,'auditorias'),where('mes','>=',y+'-01'),where('mes','<=',y+'-12')));
  const l=[]; s.forEach(d=>{const x=d.data(); l.push({no:String(x.nomina||'').trim(),op:String(x.operador||'').trim(),d:x.departamento,a:x.area,p:x.calificacion,fe:x.fecha});});
  return RC[y]=l;
}
const moda=a=>{const c={};a.filter(Boolean).forEach(v=>c[v]=(c[v]||0)+1);return Object.entries(c).sort((x,y)=>y[1]-x[1])[0]?.[0]||'';};
function ranking(l){
  const g={}; l.filter(x=>!rc.dep||x.d===rc.dep).forEach(x=>{const k=x.no||('N:'+x.op); (g[k]||=[]).push(x);});
  return Object.entries(g).map(([k,v])=>({no:k.startsWith('N:')?'':k, op:moda(v.map(x=>x.op))||('Nómina '+k), d:moda(v.map(x=>x.d)), n:v.length, p:avg(v.map(x=>x.p)), mx:Math.max(...v.map(x=>x.p)), ult:v.map(x=>x.fe).sort().pop()}))
    .filter(r=>r.n>=+rc.min).sort((a,b)=>b.p-a.p||b.n-a.n||b.mx-a.mx);
}
function tablaRank(rows,print){
  return `<table class="${print?'ph':'list'}">${print?`<thead><tr><td colspan="7"><div class="phh"><h2>Reconocimiento 8S ${rc.y}<span>Personas auditadas con mayor promedio${rc.dep?' · '+DN[rc.dep]:''} · mínimo ${rc.min} auditoría${rc.min==='1'?'':'s'}</span></h2><img src="${LOGO8S}" alt=""><img src="${LOGOZX}" alt=""></div></td></tr>`:'<thead>'}
   <tr><th>#</th><th>Auditado</th><th>Nómina</th><th>Departamento</th><th style="text-align:center">Auditorías</th><th style="text-align:center">Promedio</th><th style="text-align:center">Mejor</th></tr></thead><tbody>
   ${rows.map((r,i)=>`<tr${i<3?' style="font-weight:700"':''}><td><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span></td><td>${esc(r.op)}</td><td>${esc(r.no)}</td><td>${DN[r.d]||esc(r.d)}</td><td style="text-align:center">${r.n}</td><td style="text-align:center" class="${r.p>=META?'okc':'malc'}"><b>${f1(r.p)}</b></td><td style="text-align:center">${f1(r.mx)}</td></tr>`).join('')}</tbody></table>`;
}
function vReconocimiento(){
  const años=[...new Set(A.map(x=>x.m.slice(0,4)))].sort().reverse(); if(!rc.y) rc.y=años[0];
  const l=RC[rc.y];
  const f=`<div class="filters"><label>Año<select id="rY">${años.map(a=>`<option ${a===rc.y?'selected':''}>${a}</option>`).join('')}</select></label>
    <label>Departamento<select id="rD"><option value="">Todos</option>${DEPS.map(d=>`<option value="${d}" ${d===rc.dep?'selected':''}>${DN[d]}</option>`).join('')}</select></label>
    <label>Mínimo de auditorías<select id="rM">${['1','2','3','4','6','8'].map(n=>`<option ${n===rc.min?'selected':''}>${n}</option>`).join('')}</select></label>
    <div class="acts"><button class="btn b1" id="prR" ${l?'':'disabled'}>Imprimir</button></div></div>`;
  if(!l) return f+'<div class="msg">Cargando auditorías del año…</div>';
  const rows=ranking(l);
  return f+`<section class="panel" style="margin-top:0"><h2>Reconocimiento ${rc.y}</h2><p class="sub">Personas auditadas ordenadas por promedio de calificación${rc.dep?' en '+DN[rc.dep]:''}. En empate gana quien tiene más auditorías. ${rows.length} persona${rows.length===1?'':'s'} con al menos ${rc.min} auditoría${rc.min==='1'?'':'s'}.</p>
    ${rows.length?`<div class="wrap">${tablaRank(rows,false)}</div>`:'<p class="sub">Nadie cumple con el mínimo de auditorías seleccionado.</p>'}</section>
    <p class="foot2">Se agrupa por número de nómina. El "mínimo de auditorías" evita que alguien con una sola auditoría perfecta quede arriba de quien mantuvo buen nivel todo el año.</p>`;
}

// ---------- vistas ----------
function filtrosHTML(opts){
  const años=[...new Set(A.map(x=>x.m.slice(0,4)))].sort().reverse(), y=st.ym.slice(0,4);
  const ms=[...new Set(A.filter(x=>x.m.startsWith(y)).map(x=>x.m))].sort();
  const pool=A.filter(x=>x.m===st.ym&&(st.dep<0||x.d===DEPS[st.dep]));
  const cos=[...new Set(pool.map(x=>x.co).filter(Boolean))].sort(nat), eqs=[...new Set(pool.filter(x=>!st.co||x.co===st.co).map(x=>x.eq).filter(Boolean))].sort(nat);
  const sel=(id,lab,items,val,todo='Todos')=>`<label>${lab}<select id="${id}"><option value="">${todo}</option>${items.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
  let h=`<label>Año<select id="fY">${años.map(a=>`<option ${a===y?'selected':''}>${a}</option>`).join('')}</select></label>
   <label>Mes<select id="fM">${ms.map(m=>`<option value="${m}" ${m===st.ym?'selected':''}>${MESES[+m.slice(5)-1]}</option>`).join('')}</select></label>`;
  if(opts.includes('q')) h+=sel('fQ','Quincena',[[1,'1ª quincena'],[2,'2ª quincena']],st.q,'Ambas');
  if(opts.includes('dep')) h+=sel('fD','Departamento',DEPS.map((d,i)=>[i,DN[d]]),st.dep<0?'':st.dep);
  if(opts.includes('area')){ const as=[...new Set(pool.map(x=>x.a))].sort(nat); h+=sel('fA','Área',as.map(a=>[a,a]),st.area,'Todas'); }
  if(opts.includes('co')) h+=sel('fC','Coordinador',cos.map(c=>[c,c]),st.co);
  if(opts.includes('eq')) h+=sel('fE','Equipo Lean',eqs.map(e=>[e,e]),st.eq);
  if(opts.includes('s')) h+=sel('fS','S',SN.map((n,i)=>[i,n]),st.s,'Todas');
  if(opts.includes('txt')) h+=`<label class="grow">Buscar<input id="fT" type="search" value="${esc(st.txt)}" placeholder="Palabra en el hallazgo"></label>`;
  return h;
}
function enlazarFiltros(){
  const on=(id,fn)=>{const e=$(id); if(e) e.onchange=fn;};
  on('fY',e=>{const y=e.target.value; const ms=[...new Set(A.filter(x=>x.m.startsWith(y)).map(x=>x.m))].sort(); st.ym=ms[ms.length-1]; limpiar(); render();});
  on('fM',e=>{st.ym=e.target.value; limpiar(); render();});
  on('fQ',e=>{st.q=e.target.value; render();});
  on('fD',e=>{st.dep=e.target.value===''?-1:+e.target.value; st.area=''; st.co=''; st.eq=''; render();});
  on('fA',e=>{st.area=e.target.value; render();});
  on('fC',e=>{st.co=e.target.value; st.eq=''; render();});
  on('fE',e=>{st.eq=e.target.value; render();});
  on('fS',e=>{st.s=e.target.value; render();});
  const t=$('fT'); if(t){ t.oninput=()=>{ st.txt=t.value; clearTimeout(t._k); t._k=setTimeout(()=>{ render(); const n=$('fT'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); }; }
}
function limpiar(){ st.area=''; st.co=''; st.eq=''; }

function vInicio(){
  const au=base({dep:-1,q:'',co:'',eq:''}), tot=plantaProm(au);
  return `<div class="filters">${filtrosHTML([])}</div>
  <div class="hero">
    <div class="card hero-l"><img src="${LOGO8S}" alt="8S: Seguridad, SQF, Sustentabilidad, Seleccionar, Organizar, Limpiar, Estandarizar, Mantener">
      <div><h1>Auditoría 8S</h1><p>${ymTxt(st.ym)} · ${au.length} auditorías</p></div>
      <div class="bigbtns"><a href="#reporte">Reporte</a><a href="#hallazgos">Hallazgos</a></div></div>
    <div class="card gauge-card"><h2>PROMEDIO GENERAL DE PLANTA</h2>${gaugeSVG(tot)}
      <div class="deps">${DEPS.map((D,i)=>{const v=depProm(au,D);return `<a class="dep" href="#reporte" data-d="${i}"><span>${DN[D]}</span><b class="${v==null?'nac':v>=META?'okc':'malc'}">${f1(v)}</b></a>`}).join('')}</div></div>
  </div>`;
}
function vReporte(){
  const au=base(), D=st.dep<0?null:DEPS[st.dep];
  const eqs=[...new Set(au.map(x=>x.eq).filter(Boolean))].map(e=>({e,v:avg(au.filter(x=>x.eq===e).map(x=>x.p))})).sort((a,b)=>b.v-a.v);
  return `<div class="tabs" role="tablist">${['Planta',...DEPS.map(d=>DN[d])].map((n,i)=>`<button class="tab" role="tab" aria-selected="${st.dep===i-1}" data-d="${i-1}">${n}</button>`).join('')}</div>
  <div class="filters">${filtrosHTML(['q','co','eq'])}
    <div class="acts">${D?'<label class="chk"><input type="checkbox" id="oH" checked> Incluir hallazgos</label>':''}<button class="btn b1" id="pr1">Imprimir hoja</button><button class="btn b3" id="prA">Imprimir todos</button></div></div>
  ${D?sheetDep(st.dep,false):sheetPlanta()}
  <section class="panel"><h2>Promedio por equipo Lean</h2><p class="sub">${ymTxt(st.ym)}${D?' · '+DN[D]:' · Planta'}. Promedio de las auditorías de cada equipo.</p>
   ${eqs.length?`<div class="eqs">${eqs.map(x=>`<div class="eq"><span>${esc(x.e)}</span><div class="bar"><i class="${x.v<META?'m':''}" style="width:${x.v}%"></i></div><b class="${x.v>=META?'okc':'malc'}">${f1(x.v)}</b></div>`).join('')}</div>`:'<p class="sub">Sin auditorías.</p>'}</section>
  ${D?`<p class="foot2">Toca un área en la tabla para ver sus hallazgos.</p>`:''}`;
}
function vHallazgos(){
  const rows=hallRows();
  return `<div class="filters">${filtrosHTML(['q','dep','area','co','eq','s','txt'])}<div class="acts"><label class="chk"><input type="checkbox" id="oP"> Incluir texto de la pregunta</label><button class="btn b1" id="prH">Imprimir hallazgos</button></div></div>
  <section class="panel" style="margin-top:0"><h2>Hallazgos${st.dep<0?' de planta':' de '+DN[DEPS[st.dep]]}${st.area?' · '+esc(st.area):''}</h2><p class="sub">${ymTxt(st.ym)} · ${rows.length} hallazgo${rows.length===1?'':'s'}</p>
  ${rows.length?`<div class="wrap"><table class="list"><thead><tr><th>Área</th><th>Fecha</th><th>S</th><th>Hallazgo</th><th>Equipo</th><th>Coordinador</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><b>${esc(r.a)}</b><span class="pq">${DN[r.d]}</span></td><td style="white-space:nowrap">${r.fe.slice(8)}/${r.fe.slice(5,7)}</td><td><span class="chip">${SN[r.s]}</span></td><td>${esc(r.c||'Sin comentario')}<span class="pq">P${r.n}. ${esc(PQ[r.n]||'')}</span></td><td>${esc(r.eq)}</td><td>${esc(r.co)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">No hay hallazgos con estos filtros.</p>'}</section>`;
}

function render(){
  const app=$('app');
  app.innerHTML = st.v==='reporte'?vReporte():st.v==='hallazgos'?vHallazgos():st.v==='reconocimiento'?vReconocimiento():vInicio();
  if(st.v==='reconocimiento'){
    const y=rc.y; if(!RC[y]) cargarAnio(y).then(()=>{ if(st.v==='reconocimiento'&&rc.y===y) render(); }).catch(e=>{console.error(e); $('app').querySelector('.msg').textContent='No se pudieron cargar las auditorías. Recarga la página.';});
    const on=(id,fn)=>{const e=$(id); if(e) e.onchange=fn;};
    on('rY',e=>{rc.y=e.target.value; render();}); on('rD',e=>{rc.dep=e.target.value; render();}); on('rM',e=>{rc.min=e.target.value; render();});
    const pr=$('prR'); if(pr) pr.onclick=()=>{ $('print-root').innerHTML=tablaRank(ranking(RC[rc.y]),true); setTimeout(()=>print(),80); };
  }
  document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===st.v?'page':'false'));
  enlazarFiltros();
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{st.dep=+t.dataset.d; limpiar(); render();});
  app.querySelectorAll('.dep[data-d]').forEach(a=>a.onclick=()=>{st.dep=+a.dataset.d; limpiar();});
  app.querySelectorAll('tr.clic').forEach(tr=>tr.onclick=()=>{st.area=tr.dataset.area; location.hash='#hallazgos';});
  const p1=$('pr1'); if(p1) p1.onclick=()=>imprimir(false);
  const pa=$('prA'); if(pa) pa.onclick=()=>imprimir(true);
  const ph=$('prH'); if(ph) ph.onclick=()=>{ $('print-root').innerHTML=printHall(hallRows(),'Hallazgos 8S'+(st.dep<0?' · Planta':' · '+DN[DEPS[st.dep]])+(st.area?' · '+esc(st.area):''),$('oP')?.checked); setTimeout(()=>print(),80); };
}
function imprimir(todos){
  const inc=$('oH')?.checked; let h=''; const dep=st.dep, area=st.area;
  const hallDe=d=>{ st.dep=d; st.area=''; const r=hallRows(); st.dep=dep; st.area=area; return printHall(r,'Hallazgos 8S · '+DN[DEPS[d]]); };
  if(todos){ h=sheetPlanta(); DEPS.forEach((_,d)=>{ const sd=st.dep; st.dep=d; h+=sheetDep(d,true); st.dep=sd; }); }
  else if(dep<0) h=sheetPlanta();
  else { h=sheetDep(dep,true)+(inc?hallDe(dep):''); }
  $('print-root').innerHTML=h; setTimeout(()=>print(),80);
}
function ruta(){ const v=location.hash.replace('#',''); st.v=['reporte','hallazgos','reconocimiento'].includes(v)?v:'inicio'; render(); window.scrollTo({top:0}); }
window.addEventListener('hashchange',ruta);

async function iniciar(){
  try{
    const db=getFirestore(initializeApp(firebaseConfig)); DB=db;
    const [snap,cat]=await Promise.all([getDocs(collection(db,'resumen')),getDoc(doc(db,'catalogos','general'))]);
    CAT=cat.exists()?cat.data():{areas:[],preguntas:[]};
    (CAT.preguntas||[]).forEach(p=>PQ[p.n]=p.t);
    SMAX=SN.map((_,i)=>(CAT.preguntas||[]).filter(p=>p.s===i).reduce((s,p)=>s+p.v,0));
    snap.forEach(d=>(d.data().auditorias||[]).forEach(x=>A.push({...x,m:x.fe.slice(0,7),h:x.h||[]})));
    if(!A.length) throw new Error('vacío');
    st.ym=[...new Set(A.map(x=>x.m))].sort().pop();
    ruta();
  }catch(e){ console.error(e); $('app').innerHTML=`<div class="msg">No se pudieron cargar los resultados. Revisa tu conexión y recarga la página.</div>`; }
}
iniciar();
</script>
</body>
</html>
