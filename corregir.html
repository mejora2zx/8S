<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Corrección única del historial 8S</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#0D18A8;--naranja:#FF4E00;--ok:#1E8E3E;--mal:#D7261E;--bg:#EEF0F7;--panel:#fff;--ink:#141833;--ink2:#50577A;--line:#D5D9E8;
  --font:"Schibsted Grotesk","Lab Grotesque","Helvetica Neue",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1130;--panel:#181C44;--ink:#EEF0FA;--ink2:#A7ADCF;--line:#2C3163;}}
:root[data-theme="dark"]{--bg:#0E1130;--panel:#181C44;--ink:#EEF0FA;--ink2:#A7ADCF;--line:#2C3163;}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.hide{display:none!important}
.top{background:var(--azul);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top b{font-size:20px;font-weight:800;margin-right:auto}
.top small{opacity:.85;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:20px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.login{max-width:420px;margin:40px auto}
.login h1{margin:0 0 6px;font-size:24px}
label.f{display:block;font-weight:700;font-size:14px;margin-top:12px}
input,select{width:100%;margin-top:5px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.b1{background:var(--naranja);color:#fff}.b2{background:var(--azul);color:#fff}.b3{background:transparent;border:1px solid var(--line)}
.bd{background:transparent;border:1px solid var(--mal);color:var(--mal)}
.top .b3{border-color:rgba(255,255,255,.4);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--naranja)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:160px}
.row>div.s{flex:0 0 140px;min-width:120px}
h2{margin:0 0 4px;font-size:20px}
.sub{color:var(--ink2);margin:0 0 12px;font-size:14px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;color:var(--ink2);border-bottom:2px solid var(--line);padding:8px}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
td.acts{text-align:right;white-space:nowrap}
td.acts .btn{padding:6px 10px;font-size:13px}
.grp{font-weight:800;color:var(--azul);padding-top:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grp{color:#AEB4FF}}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:44px;height:24px;border-radius:12px;background:#C9CDEA;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{left:23px}
.sw input:focus-visible+i{outline:3px solid var(--naranja);outline-offset:2px}
.on{color:var(--ok)}.off{color:var(--mal)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141833;color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw}
.err{color:var(--mal);font-weight:600;margin-top:10px;min-height:22px}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;margin:12px 0}
.det b{display:block;font-size:12px;color:var(--ink2)}
.det img{max-width:260px;border:1px solid var(--line);border-radius:8px;background:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><b>Corrección única del historial 8S</b><small id="who"></small></div></header>
<main>
  <section class="card login" id="vLogin">
    <h1>Iniciar sesión</h1>
    <p class="sub">Usa la misma contraseña de administración. Esta página se usa una sola vez y después se borra del repositorio.</p>
    <label class="f" for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lErr" aria-live="polite"></div>
    <button class="btn b1" id="entrar" style="width:100%;margin-top:6px">Entrar</button>
  </section>
  <section id="vApp" class="hide"><div id="panel"><div class="card">Revisando el historial…</div></div></section>
</main>

const MOTIVO = 'Ajuste con calificación oficial (Excel mensual)';
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const MESN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
async function propuestas(){
  await cargarCat();
  const R={};
  for(const m of Object.keys(OFICIAL.of)){ const s=await getDoc(doc(db,'resumen',m)); R[m]=s.exists()?(s.data().auditorias||[]):[]; }
  const P=[];
  for(const [m,of] of Object.entries(OFICIAL.of)){
    const L=R[m], by=a=>L.filter(x=>x.a===a), usados=new Set();
    for(const [a,v] of Object.entries(of)){
      if(by(a).length) continue;
      const c=L.find(x=>!usados.has(x.f) && x.a!==a && x.d===depDe(a) && Math.abs(x.p-v)<0.51 && of[x.a]!=null && by(x.a).length>1 && by(x.a).some(y=>y!==x && Math.abs(y.p-of[x.a])<0.51) && Math.abs(avg(by(x.a).map(y=>y.p))-of[x.a])>0.5);
      if(c){ usados.add(c.f); P.push({t:'mover',m,f:c.f,de:c.a,a,p:v}); }
      else P.push({t:'agregar',m,a,p:v});
    }
    for(const [a,v] of Object.entries(of)){
      const l=by(a).filter(x=>!usados.has(x.f)); if(!l.length) continue;
      const av=avg(l.map(x=>x.p)); if(Math.abs(av-v)<=0.5) continue;
      if(l.length===1) P.push({t:'ajustar',m,f:l[0].f,a,de:l[0].p,p:v});
      else P.push({t:'revisar',m,a,txt:`${l.length} auditorías (${l.map(x=>'folio '+x.f+': '+x.p).join(', ')}) promedian ${Math.round(av*10)/10}; el Excel dice ${v}. Elimina la que sobre desde la pestaña Auditorías.`});
    }
    for(const x of L) if((OFICIAL.na[m]||[]).includes(x.a)) P.push({t:'revisar',m,a:x.a,txt:`Folio ${x.f} (${x.p}) existe, pero el Excel marca N/A.`});
  }
  return P;
}
const depDe=a=>(CAT.areas.find(x=>x.a===a)||{}).d||'';

  const rr=doc(db,'resumen',p.m), corr={motivo:MOTIVO, fecha:new Date().toISOString()};

    }

      const fr=doc(db,'config','folio'), fs=await tx.get(fr), folio=fs.data().ultimo+1, d=depDe(p.a), fe=p.m+'-15';
      tx.update(fr,{ultimo:folio});
      tx.set(doc(db,'auditorias',String(folio)),{folio, fecha:fe, mes:p.m, quincena:1, departamento:d, area:p.a, nomina:'', operador:'', coordinador:'', equipo:'',
        calificacion:p.p, puntosS:null, respuestas:[], firma:'', origen:'excel', sinDetalle:true, correccion:corr, creado:serverTimestamp()});
      tx.set(rr,{auditorias:[...L,{f:folio,d,a:p.a,fe,q:1,p:p.p,sp:null,eq:'',co:'',h:[],sinDetalle:true}],actualizado:serverTimestamp()});
    }
  });
}
async function vAju(P){
  const L=await propuestas(), ap=L.filter(p=>p.t!=='revisar'), rv=L.filter(p=>p.t==='revisar');
  const txt=p=>p.t==='ajustar'?`Cambiar calificación del folio ${p.f}: <b>${p.de} → ${p.p}</b>`
    :p.t==='mover'?`Cambiar el folio ${p.f} de <b>${esc(p.de)}</b> a <b>${esc(p.a)}</b> (${p.p})`
    :`Agregar registro sin detalle con calificación <b>${p.p}</b>`;
  P.innerHTML=`<div class="card"><h2>Ajuste con las calificaciones oficiales</h2>
    <p class="sub">Compara lo que está en Firebase contra las calificaciones de los Excel mensuales de enero a septiembre de 2026 y propone las correcciones. Cada cambio guarda la calificación o el área original y el motivo. Los registros agregados no tienen respuestas ni hallazgos: solo cuentan para la calificación del área y la tendencia.</p>
    ${!L.length?'<p style="font-weight:800;color:var(--ok);font-size:18px">✓ Todo cuadra con los Excel. No hay nada que corregir.</p>':''}
    ${ap.length?`<div class="wrap"><table><thead><tr><th>Mes</th><th>Área</th><th>Corrección</th></tr></thead><tbody>${ap.map(p=>`<tr><td>${MESN[+p.m.slice(5)-1]}</td><td>${esc(p.a)}</td><td>${txt(p)}</td></tr>`).join('')}</tbody></table></div>
      <div class="row" style="margin-top:14px"><button class="btn b1" id="ajApl">Aplicar ${ap.length} correccion${ap.length===1?'':'es'}</button></div><div class="err" id="ajErr" aria-live="polite"></div>`:''}</div>
    ${rv.length?`<div class="card"><h2>Para revisar a mano</h2><div class="wrap"><table><thead><tr><th>Mes</th><th>Área</th><th>Detalle</th></tr></thead><tbody>${rv.map(p=>`<tr><td>${MESN[+p.m.slice(5)-1]}</td><td>${esc(p.a)}</td><td>${esc(p.txt)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
  const b=$('ajApl'); if(b) b.onclick=async()=>{
    if(!confirm(`¿Aplicar ${ap.length} correcciones?`)) return;
    b.disabled=true; let ok=0;
    for(const p of ap){ try{ await aplicar(p); ok++; b.textContent=`Aplicando… ${ok}/${ap.length}`; }catch(e){ console.error(e); $('ajErr').textContent=e.code==='permission-denied'?'Faltan las reglas nuevas de Firestore para correcciones.':'Se detuvo por un error. Vuelve a abrir esta pestaña para ver lo que falta.'; break; } }
    toast(`${ok} correcciones aplicadas`); if(ok===ap.length) vAju(P);
  };
}


</script>
